services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: sgai-backend:latest
    ports:
      - "3001:3001"
    environment:
      JWT_SECRET: ${JWT_SECRET:-secreto-de-prueba-lab}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s